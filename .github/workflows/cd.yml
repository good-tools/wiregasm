name: Release

# Runs after Build & Test succeeds on a push to master. release-please keeps a
# release PR open with the next version and changelog; merging that PR tags the
# release, and the publish job ships the wasm built by that same CI run.
#
# Keep this filename: npm trusted publishing is bound to `cd.yml`.
on:
  workflow_run:
    workflows: [Build & Test]
    branches: [master]
    types: [completed]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.repository == 'good-tools/wiregasm' }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # release-please always acts on the current master tip, so only run it for
      # the CI run of that tip. A late-finishing run for an older commit would
      # otherwise publish its own checkout and artifact under the new tag.
      - name: Check run is for master tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq .sha)
          if [ "$tip" = "$HEAD_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping: run is for $HEAD_SHA, master is at $tip"
          fi

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: steps.tip.outputs.latest == 'true'
        with:
          # PAT so the release PR triggers Build & Test (GITHUB_TOKEN events don't).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload release assets
      actions: read # download the artifact from the CI run
      id-token: write # npm trusted publishing
    steps:
      - name: Check release commit matches CI run
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$RELEASE_SHA" != "$HEAD_SHA" ]; then
            echo "::error::Release commit $RELEASE_SHA != CI run commit $HEAD_SHA; publish manually from the release commit's CI artifact."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@11

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lib
          path: built/bin/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - run: npm ci
      - run: npm run build
      - run: npm publish

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/* --clobber

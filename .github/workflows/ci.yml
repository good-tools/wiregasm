name: Build & Test

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'

# A new push to a PR cancels its outdated run. Runs on master always finish,
# because the Release workflow is triggered by them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Configure Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: 'npm'

    - run: npm ci
    - run: npm run lint

  # Cheap: download + prepare every dependency, no compile. Fails as soon as a
  # patch stops applying.
  check-patches:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Cache tarballs
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/tarballs
        key: tarballs-${{ hashFiles('mk/deps/**') }}
        restore-keys: tarballs-

    - run: make -j"$(nproc)" check-patches

    # dependency versions must match the ones Wireshark pins
    - run: node scripts/dep-versions.mjs

  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Configure Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: 'npm'

    # The Makefile is the single source of the emsdk version.
    - name: Read toolchain versions
      run: |
        echo "EMSDK_VERSION=$(sed -n 's/^EMSDK_VERSION := //p' Makefile)" >> "$GITHUB_ENV"
        echo "MESON_VERSION=$(sed -n 's/^MESON_VERSION := //p' Makefile)" >> "$GITHUB_ENV"

    - name: Setup emsdk
      uses: mymindstorm/setup-emsdk@v11
      with:
        version: ${{ env.EMSDK_VERSION }}

    - name: Verify EMSDK
      run: emcc -v

    - name: Install build tools
      run: |
        sudo apt-get -qq -y update && sudo DEBIAN_FRONTEND="noninteractive" TZ="America/San_Francisco" apt-get install -y --no-install-recommends \
          flex \
          lemon \
          pkg-config \
          cmake \
          ninja-build \
          autoconf \
          automake \
          autopoint \
          libtool \
          libltdl-dev \
          python3-setuptools \
          python3-packaging

    # Caches the installed dependencies (glib, wireshark, ...) only. The key
    # covers everything that changes them; lib/wiregasm is always rebuilt.
    # Installed like the builder image does: into the system Python, so that
    # glib's build scripts see the same modules (setuptools, packaging).
    - name: Install meson
      run: sudo pip3 install --break-system-packages "meson==$MESON_VERSION"

    - name: Cache dependencies
      id: deps-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          built
          !built/bin/wiregasm.*
          !built/share/wiregasm
        key: deps-emsdk-${{ env.EMSDK_VERSION }}-meson-${{ env.MESON_VERSION }}-${{ hashFiles('Makefile', 'mk/**', 'patches/**', 'overlay/**', 'scripts/patches.mjs') }}

    # On a cache hit, `-o build/stamp/wireshark.built` tells make to treat the
    # dependency chain as built and only compile lib/wiregasm against the
    # restored prefix.
    - name: Build WASM lib
      env:
        CACHE_HIT: ${{ steps.deps-cache.outputs.cache-hit }}
      run: |
        if [ "$CACHE_HIT" = "true" ]; then
          make -j"$(nproc)" -o build/stamp/wireshark.built
        else
          make -j"$(nproc)"
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: lib
        path: |
          built/bin/wiregasm.*

  # The wasm is built once; the tests run against it on every supported Node LTS.
  test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Configure Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node }}
        cache: 'npm'

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: lib
        path: built/bin/

    - run: npm ci
    - run: npm test

    # gzipped wasm + data must stay within +10% of the latest npm release
    - name: Size check
      if: matrix.node == 24
      run: npm run size-check

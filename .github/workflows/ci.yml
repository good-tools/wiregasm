name: Build & Test

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'

# A new push to a PR cancels its outdated run. Runs on master always finish,
# because the Release workflow is triggered by them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Configure Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: 'npm'

    - run: npm ci
    - run: npm run lint

    # workflow files: syntax, expressions, shellcheck of run: steps
    - name: actionlint
      run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -color

  # Cheap: download + prepare every dependency, no compile. Fails as soon as a
  # patch stops applying.
  check-patches:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Cache tarballs
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/tarballs
        key: tarballs-${{ hashFiles('mk/deps/**') }}
        restore-keys: tarballs-

    - run: make -j"$(nproc)" check-patches

    # dependency versions must match the ones Wireshark pins
    - run: node scripts/dep-versions.mjs

  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # publish the deps image (pushes from master only)

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # The deps image (docker/build.Dockerfile, stage `deps`) is the toolchain
    # plus every compiled dependency. Its tag is a hash of everything that goes
    # into it, so it's only rebuilt when one of those changes.
    - name: Deps image tag
      id: deps
      run: |
        echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-deps:${{ hashFiles('docker/build.Dockerfile', 'Makefile', 'mk/**', 'patches/**', 'overlay/**', 'scripts/patches.mjs') }}" >> "$GITHUB_OUTPUT"
        echo "EMSDK_VERSION=$(sed -n 's/^EMSDK_VERSION := //p' Makefile)" >> "$GITHUB_ENV"
        echo "MESON_VERSION=$(sed -n 's/^MESON_VERSION := //p' Makefile)" >> "$GITHUB_ENV"

    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Pull deps image
      id: pull
      env:
        IMAGE: ${{ steps.deps.outputs.image }}
      run: docker pull "$IMAGE" || echo "missing=true" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      if: steps.pull.outputs.missing == 'true'

    # Layers are cached in the Actions cache, so iterating on a PR that changes
    # a dependency only rebuilds from the changed step on.
    - name: Build deps image
      if: steps.pull.outputs.missing == 'true'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: docker/build.Dockerfile
        target: deps
        build-args: |
          EMSDK_VERSION=${{ env.EMSDK_VERSION }}
          MESON_VERSION=${{ env.MESON_VERSION }}
        tags: ${{ steps.deps.outputs.image }}
        labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
        load: true
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        cache-from: type=gha,scope=deps
        cache-to: type=gha,scope=deps,mode=max

    # Same image, same toolchain as `make docker`: only lib/wiregasm is
    # compiled, against the prebuilt dependencies.
    - name: Build WASM lib
      env:
        IMAGE: ${{ steps.deps.outputs.image }}
      run: |
        docker create --name deps "$IMAGE" >/dev/null
        docker cp deps:/src/built ./built
        docker rm deps >/dev/null
        docker run --rm -v "$PWD":/src -w /src "$IMAGE" \
          make -j"$(nproc)" -o build/stamp/wireshark.built wiregasm

    - name: Upload Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: lib
        path: |
          built/bin/wiregasm.*

  # The wasm is built once; the tests run against it on every supported Node LTS.
  test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Configure Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node }}
        cache: 'npm'

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: lib
        path: built/bin/

    - run: npm ci
    - run: npm test

    # gzipped wasm + data must stay within +10% of the latest npm release
    - name: Size check
      if: matrix.node == 24
      run: npm run size-check

  # The package exactly as it would be published (npm pack), used by a Node.js
  # project and by a plain HTML page in Chromium.
  e2e:
    needs: build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Configure Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: 'npm'

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: lib
        path: built/bin/

    - run: npm ci
    - run: npm run build
    - run: npx playwright install --with-deps chromium
    - run: npm run test:e2e


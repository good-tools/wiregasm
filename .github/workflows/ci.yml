name: Build & Test

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'

# A new push to a PR cancels its outdated run. Runs on master always finish,
# because the Release workflow is triggered by them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  EMSDK_VERSION: 3.1.31

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Configure Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: 'npm'

    - name: Stash old path
      run: echo "OLD_PATH=$PATH" >> "${GITHUB_ENV}"

    - name: Setup emsdk
      uses: mymindstorm/setup-emsdk@v11
      with:
        version: ${{ env.EMSDK_VERSION }}

    - name: Verify EMSDK
      run: emcc -v

    - name: Install build tools
      run: |
        sudo apt-get -qq -y update && sudo DEBIAN_FRONTEND="noninteractive" TZ="America/San_Francisco" apt-get install -y --no-install-recommends \
          flex \
          lemon \
          pkg-config \
          cmake \
          ninja-build \
          meson \
          autoconf \
          automake \
          autopoint \
          libtool \
          libltdl-dev

    # Caches the installed dependencies (glib, wireshark, ...) only. The key
    # covers everything that changes them; lib/wiregasm is always rebuilt.
    - name: Cache dependencies
      id: deps-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          built
          !built/bin/wiregasm.*
          !built/share/wiregasm
        key: deps-emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('patches/**', 'lib/Makefile', 'lib/crossfile.meson') }}

    # On a cache hit, `-o .wireshark` tells make to treat the dependency chain
    # as built and only compile lib/wiregasm against the restored prefix.
    - name: Build WASM lib
      env:
        CACHE_HIT: ${{ steps.deps-cache.outputs.cache-hit }}
      run: |
        if [ "$CACHE_HIT" = "true" ]; then
          make -C lib -j"$(nproc)" -o .wireshark
        else
          make -C lib -j"$(nproc)"
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: lib
        path: |
          built/bin/wiregasm.*

    # hack to not use node 14 bundled with emsdk
    - name: Restore Path
      run: echo "$OLD_PATH" > $GITHUB_PATH

    - name: Load Dependencies
      run: npm ci

    - name: Run Tests
      run: npm test
